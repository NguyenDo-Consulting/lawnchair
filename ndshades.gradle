// ND Shades strings for every build. Applied from build.gradle, and kept here so that upstream's
// string files stay as they are.

/**
 * Generates overrides of the strings in a resource dir that name Lawnchair, in every language,
 * with ND Shades in its place. They're generated at build time, so they follow upstream's
 * strings and translations.
 */
abstract class RebrandStringsTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceRes()

    @Input
    abstract Property<String> getAppName()

    /** Strings that keep naming Lawnchair, e.g. ones about the Lawnchair project itself. */
    @Input
    abstract SetProperty<String> getKeptStrings()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def outDir = outputDir.get().asFile
        outDir.deleteDir()
        // No leading \b: in "\n\nLawnchair", the escaped newline puts an n right before it.
        def name = ~/Lawnchair(?!\w)/
        def element = ~/(?s)<(string|plurals)\s+name="([^"]+)"[^>]*>.*?<\/\1>/
        sourceRes.get().asFile.eachDirMatch(~/values(-.+)?/) { valuesDir ->
            def stringsFile = new File(valuesDir, "strings.xml")
            if (!stringsFile.exists()) return
            // Comments may name Lawnchair, or hold commented-out strings.
            def xml = stringsFile.getText("UTF-8").replaceAll(~/(?s)<!--.*?-->/, "")
            def overrides = []
            element.matcher(xml).with { m ->
                while (m.find()) {
                    def text = m.group()
                    if (m.group(2) in keptStrings.get() || !(text =~ name)) continue
                    // Only the text is changed, the name attribute stays.
                    def openTagEnd = text.indexOf('>') + 1
                    overrides << text.substring(0, openTagEnd) +
                        text.substring(openTagEnd).replaceAll(name, appName.get())
                }
            }
            if (overrides.isEmpty()) return
            def outValuesDir = new File(outDir, valuesDir.name)
            outValuesDir.mkdirs()
            new File(outValuesDir, "ndshades_strings.xml").setText(
                """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by ndshades.gradle from ${valuesDir.name}/strings.xml. Don't edit. -->
<resources xmlns:tools="http://schemas.android.com/tools" xmlns:xliff="urn:oasis:names:tc:xliff:document:1.2">
    ${overrides.join("\n    ")}
</resources>
""",
                "UTF-8",
            )
        }
    }
}

def rebrandStrings = tasks.register("generateNdShadesStrings", RebrandStringsTask) {
    sourceRes = layout.projectDirectory.dir("lawnchair/res")
    appName = "ND Shades"
    keptStrings = []
    outputDir = layout.buildDirectory.dir("generated/res/ndShadesStrings")
}

// The app name is set in build.gradle, which can use the Android plugin's classes.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res?.addGeneratedSourceDirectory(rebrandStrings) { it.outputDir }
    }
}
